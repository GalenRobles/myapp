services:
  mssql:
      image:    mcr.microsoft.com/mssql/server:2022-latest
      container_name:  mssql
      restart:    unless_stopped
      enviroment:
         ACEPT_EULA: "Y"
         MSSQL_SA_PASSWORD: "L12345678"
         MSSQL_PID:  "Developer"
         TZ: "America/Mexico"
      ports:
         - "1433:1433"
      volumes:
         - mssql_data: /var/opt/mssql
